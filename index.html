<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friends Age</title>
    
    <!-- iOS設定: ステータスバーを白背景・黒文字にして被りを防ぐ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/avataaars/png?seed=AppIcon&backgroundColor=b6e3f4">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 安全な余白確保 */
        body {
            /* iPhoneのノッチ（切り欠き）対応 */
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
        }
        /* モーダル表示時に背景を固定 */
        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Icons (Inline) ---
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Plus: (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>,
            X: (p) => <IconWrapper {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>,
            Settings: (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>,
            Calendar: (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconWrapper>,
            Edit2: (p) => <IconWrapper {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></IconWrapper>,
            Trash2: (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>,
            Save: (p) => <IconWrapper {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconWrapper>,
            Twitter: (p) => <IconWrapper {...p}><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-12.7 12.5S1.2 2.9 8.3 2.8c.5.02 3-.5 3-.5s.3-1.5.2-2c.1-.9.3-1.2.4-1.4.3.1.6.1.6.1s1.3-1.6 4-1.4l.2.6s1.9-1.6 3-1.8c1.1-.2 1.2.7 1.2.7z"/></IconWrapper>,
            Link: (p) => <IconWrapper {...p}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></IconWrapper>,
            CheckCircle2: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>,
            HelpCircle: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></IconWrapper>,
            ExternalLink: (p) => <IconWrapper {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></IconWrapper>,
            Hash: (p) => <IconWrapper {...p}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></IconWrapper>,
            AlertTriangle: (p) => <IconWrapper {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconWrapper>,
            Download: (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>,
            Upload: (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconWrapper>,
            Copy: (p) => <IconWrapper {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconWrapper>,
            Baby: (p) => <IconWrapper {...p}><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/></IconWrapper>,
            Minus: (p) => <IconWrapper {...p}><line x1="5" x2="19" y1="12" y2="12"/></IconWrapper>
        };

        const STORAGE_KEY = 'friends_tracker_secure_v6_family';

        // Theme & Constants
        const THEME_COLORS = [
            { name: 'Slate', bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-200' },
            { name: 'Red', bg: 'bg-red-100', text: 'text-red-600', border: 'border-red-200' },
            { name: 'Orange', bg: 'bg-orange-100', text: 'text-orange-600', border: 'border-orange-200' },
            { name: 'Amber', bg: 'bg-amber-100', text: 'text-amber-600', border: 'border-amber-200' },
            { name: 'Green', bg: 'bg-green-100', text: 'text-green-600', border: 'border-green-200' },
            { name: 'Blue', bg: 'bg-blue-100', text: 'text-blue-600', border: 'border-blue-200' },
            { name: 'Indigo', bg: 'bg-indigo-100', text: 'text-indigo-600', border: 'border-indigo-200' },
            { name: 'Purple', bg: 'bg-purple-100', text: 'text-purple-600', border: 'border-purple-200' },
            { name: 'Pink', bg: 'bg-pink-100', text: 'text-pink-600', border: 'border-pink-200' },
        ];
        const AVATAR_EMOJIS = ['😀', '😎', '🤓', '🥳', '🤔', '🥺', '🤠', '👽', '💩', '🐶', '🐱', '🦊', '🐻', '🐼', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🦄', '🍺', '⚽', '🎮', '🎨', '🎤', '🎸', '📷', '💻', '✏️', '✈️'];

        // Utils
        const calculateAge = (birthday) => {
            if (!birthday) return null;
            const birthDate = new Date(birthday);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        };

        const getNextBirthday = (birthday) => {
            if (!birthday) return null;
            const today = new Date();
            const birthDate = new Date(birthday);
            const next = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (next < today) next.setFullYear(today.getFullYear() + 1);
            const diffTime = Math.abs(next - today);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        };

        const extractTwitterId = (input) => {
            if (!input) return '';
            try {
                if (input.includes('twitter.com') || input.includes('x.com')) {
                    const url = new URL(input);
                    const pathSegments = url.pathname.split('/').filter(Boolean);
                    return pathSegments[0] || '';
                }
            } catch (e) {}
            return input.replace('@', '').split('?')[0].split('/')[0].trim();
        };

        // --- Components ---
        const Modal = ({ children, onClose }) => {
            // モーダルが開いている間、bodyのスクロールを止める
            useEffect(() => {
                document.body.classList.add('modal-open');
                return () => document.body.classList.remove('modal-open');
            }, []);

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm animate-in fade-in duration-200" style={{paddingBottom: 'env(safe-area-inset-bottom)'}}>
                    <div className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden relative animate-in slide-in-from-bottom-10 sm:zoom-in-95 duration-200 max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        {children}
                    </div>
                    <div className="absolute inset-0 -z-10" onClick={onClose}></div>
                </div>
            );
        };

        const SmartAvatar = ({ friend, size = "md", className = "" }) => {
            const [imgError, setImgError] = useState(false);
            useEffect(() => setImgError(false), [friend.twitterId]);
            const theme = THEME_COLORS.find(t => t.name === friend.colorTheme) || THEME_COLORS[0];
            const sizeClasses = { sm: "w-10 h-10 text-lg", md: "w-12 h-12 text-xl", lg: "w-24 h-24 text-4xl", xl: "w-32 h-32 text-5xl" };
            
            if (friend.twitterId && friend.twitterId.trim() !== '' && !imgError) {
                return (
                    <div className={`${sizeClasses[size]} rounded-full overflow-hidden border border-slate-200 bg-slate-100 shadow-sm flex-shrink-0 relative ${className}`}>
                        <img src={`https://unavatar.io/twitter/${friend.twitterId}`} alt={friend.name} className="w-full h-full object-cover" onError={() => setImgError(true)} />
                    </div>
                );
            }
            return (
                <div className={`${sizeClasses[size]} ${theme.bg} ${theme.text} rounded-full flex items-center justify-center border ${theme.border} shadow-sm flex-shrink-0 font-bold select-none ${className}`}>
                    {friend.emoji || friend.name.charAt(0) || '?'}
                </div>
            );
        };

        const BackupModal = ({ friends, onRestore, onClose }) => {
            const [jsonStr, setJsonStr] = useState('');
            const [mode, setMode] = useState('export');
            const [message, setMessage] = useState('');

            useEffect(() => {
                if (mode === 'export') setJsonStr(JSON.stringify(friends));
                else setJsonStr('');
                setMessage('');
            }, [mode, friends]);

            const handleCopy = () => {
                navigator.clipboard.writeText(jsonStr);
                setMessage('コピーしました！メモ帳などに貼り付けて保存してください。');
            };

            const handleRestore = () => {
                try {
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed)) {
                        if(window.confirm('現在のデータは上書きされます。よろしいですか？')) {
                            onRestore(parsed);
                            onClose();
                        }
                    } else { setMessage('データ形式が正しくありません'); }
                } catch (e) { setMessage('データの読み込みに失敗しました。'); }
            };

            return (
                <div className="flex flex-col h-full max-h-[80vh]">
                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                        <h3 className="font-bold text-slate-800">データ管理</h3>
                        <button onClick={onClose}><Icons.X size={24} className="text-slate-400" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                        <div className="flex gap-2 p-1 bg-slate-100 rounded-lg">
                            <button onClick={() => setMode('export')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-colors flex items-center justify-center gap-2 ${mode === 'export' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}><Icons.Download size={16} /> バックアップ</button>
                            <button onClick={() => setMode('import')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-colors flex items-center justify-center gap-2 ${mode === 'import' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}><Icons.Upload size={16} /> 復元する</button>
                        </div>
                        {mode === 'export' ? (
                            <div className="space-y-4">
                                <p className="text-sm text-slate-600">下のテキストをすべてコピーして、iPhoneのメモ帳などに保存しておいてください。</p>
                                <textarea readOnly value={jsonStr} className="w-full h-40 p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl text-slate-500 font-mono focus:outline-none" />
                                <button onClick={handleCopy} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 active:bg-blue-700"><Icons.Copy size={18} /> テキストをコピー</button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <p className="text-sm text-slate-600">保存しておいたバックアップテキストを下に貼り付けてください。</p>
                                <textarea value={jsonStr} onChange={(e) => setJsonStr(e.target.value)} placeholder='[{"id":"1", ...}]' className="w-full h-40 p-3 text-xs bg-white border-2 border-blue-100 rounded-xl text-slate-800 font-mono focus:outline-none focus:border-blue-500" />
                                <button onClick={handleRestore} disabled={!jsonStr} className="w-full py-3 bg-red-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed active:bg-red-600"><Icons.Upload size={18} /> 復元を実行</button>
                            </div>
                        )}
                        {message && <div className={`p-3 rounded-lg text-sm font-bold text-center ${message.includes('失敗') ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`}>{message}</div>}
                    </div>
                </div>
            );
        };

        const FriendForm = ({ initialData = {}, onSave, onCancel, isNew }) => {
            const [formData, setFormData] = useState({
                id: initialData.id || '',
                name: initialData.name || '',
                twitterId: initialData.twitterId || '',
                birthday: initialData.birthday || '',
                isTentative: initialData.isTentative || false,
                memo: initialData.memo || '',
                colorTheme: initialData.colorTheme || 'Slate',
                emoji: initialData.emoji || '',
                family: initialData.family || [] 
            });
            const [rawLink, setRawLink] = useState(initialData.twitterId ? `https://x.com/${initialData.twitterId}` : '');
            const [showAdvancedIcon, setShowAdvancedIcon] = useState(false);
            
            // Family Temp State
            const [famName, setFamName] = useState('');
            const [famBirthday, setFamBirthday] = useState('');
            const [famRelation, setFamRelation] = useState('');

            const handleLinkChange = (e) => {
                const val = e.target.value;
                setRawLink(val);
                setFormData(prev => ({ ...prev, twitterId: extractTwitterId(val) }));
            };

            const addFamilyMember = () => {
                if(!famName) return;
                const newMember = {
                    id: Date.now().toString(),
                    name: famName,
                    birthday: famBirthday,
                    relation: famRelation
                };
                setFormData(prev => ({ ...prev, family: [...prev.family, newMember] }));
                setFamName(''); setFamBirthday(''); setFamRelation('');
            };

            const removeFamilyMember = (id) => {
                setFormData(prev => ({ ...prev, family: prev.family.filter(m => m.id !== id) }));
            };

            return (
                <div className="flex flex-col h-full max-h-[85vh]">
                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white z-10">
                        <h3 className="font-bold text-slate-800">{isNew ? '友達を追加' : '編集'}</h3>
                        <button onClick={onCancel}><Icons.X size={24} className="text-slate-400" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                        <div className="flex flex-col items-center justify-center mb-2">
                            <SmartAvatar friend={formData} size="lg" className="mb-3" />
                            {!formData.twitterId && (
                                <button onClick={() => setShowAdvancedIcon(!showAdvancedIcon)} className="text-xs text-slate-400 underline hover:text-slate-600">アイコンの手動設定</button>
                            )}
                        </div>
                        <div className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">Twitter/X リンク</label>
                                <div className="relative group">
                                    <span className="absolute left-4 top-3.5 text-slate-400"><Icons.Link size={16} /></span>
                                    <input type="text" value={rawLink} onChange={handleLinkChange} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all font-medium text-sm" placeholder="https://x.com/..." />
                                </div>
                            </div>

                            {(showAdvancedIcon || (!formData.twitterId && formData.emoji)) && (
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <label className="text-xs font-bold text-slate-500 mb-2 block">代替アイコン</label>
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {THEME_COLORS.map(theme => (
                                            <button key={theme.name} onClick={() => setFormData({...formData, colorTheme: theme.name})} className={`w-6 h-6 rounded-full border-2 ${theme.bg} ${formData.colorTheme === theme.name ? 'border-slate-800 scale-110' : 'border-transparent'}`} />
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {AVATAR_EMOJIS.map(emoji => (
                                            <button key={emoji} onClick={() => setFormData({...formData, emoji: formData.emoji === emoji ? '' : emoji})} className={`text-lg w-8 h-8 flex items-center justify-center rounded hover:bg-white ${formData.emoji === emoji ? 'bg-white shadow-sm ring-1 ring-slate-200' : ''}`} >{emoji}</button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">名前 <span className="text-red-500">*</span></label>
                                <input type="text" required value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-800 transition-all" placeholder="名前を入力" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">誕生日</label>
                                <input type="date" value={formData.birthday} onChange={(e) => setFormData({...formData, birthday: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-800 transition-all appearance-none" />
                                <label className="flex items-center gap-2 mt-3 cursor-pointer select-none">
                                    <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${formData.isTentative ? 'bg-amber-500 border-amber-500' : 'border-slate-300 bg-white'}`}>{formData.isTentative && <Icons.CheckCircle2 size={14} className="text-white" />}</div>
                                    <input type="checkbox" className="hidden" checked={formData.isTentative} onChange={(e) => setFormData({...formData, isTentative: e.target.checked})} />
                                    <span className="text-sm text-slate-600">この日付は予想です（不確定）</span>
                                </label>
                            </div>

                            {/* Family Section */}
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label className="flex items-center gap-2 text-xs font-bold text-slate-500 mb-3">
                                    <Icons.Baby size={16} /> 家族・子供
                                </label>
                                <div className="space-y-2 mb-3">
                                    {formData.family.map(member => {
                                        const age = calculateAge(member.birthday);
                                        return (
                                            <div key={member.id} className="flex items-center justify-between bg-white p-2 rounded-lg border border-slate-100 text-sm">
                                                <div>
                                                    <span className="font-bold mr-2">{member.name}</span>
                                                    {age !== null && <span className="text-slate-500 text-xs bg-slate-100 px-1.5 py-0.5 rounded mr-2">{age}歳</span>}
                                                    <span className="text-xs text-slate-400">{member.relation}</span>
                                                </div>
                                                <button onClick={() => removeFamilyMember(member.id)} className="text-red-400 hover:text-red-600 p-1"><Icons.Minus size={16} /></button>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-2">
                                    <input type="text" value={famName} onChange={e => setFamName(e.target.value)} placeholder="名前" className="flex-1 p-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-400" />
                                    <input type="date" value={famBirthday} onChange={e => setFamBirthday(e.target.value)} className="w-28 p-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-400" />
                                </div>
                                <div className="flex gap-2 mt-2">
                                    <input type="text" value={famRelation} onChange={e => setFamRelation(e.target.value)} placeholder="メモ (例: 長男)" className="flex-1 p-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-400" />
                                    <button onClick={addFamilyMember} disabled={!famName} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50">追加</button>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">メモ</label>
                                <textarea value={formData.memo} onChange={(e) => setFormData({...formData, memo: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-800 transition-all text-sm h-20 resize-none" placeholder="備考..." />
                            </div>
                        </div>
                    </div>
                    <div className="p-4 border-t border-slate-100 bg-white pb-8">
                        <button onClick={() => onSave(formData)} disabled={!formData.name} className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-slate-800 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"><Icons.Save size={18} /> 保存</button>
                    </div>
                </div>
            );
        };

        const FriendDetail = ({ friend, onClose, onEdit, onDelete }) => {
            const age = calculateAge(friend.birthday);
            const [deleteConfirm, setDeleteConfirm] = useState(false);
            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="h-28 w-full bg-slate-100 relative overflow-hidden">
                        {friend.twitterId && <img src={`https://unavatar.io/twitter/${friend.twitterId}`} className="w-full h-full object-cover opacity-30 blur-md scale-110" alt="" />}
                        <button onClick={onClose} className="absolute top-3 right-3 p-2 bg-black/10 hover:bg-black/20 text-slate-700 rounded-full transition-colors backdrop-blur-sm"><Icons.X size={20} /></button>
                    </div>
                    <div className="px-6 pb-6 flex-1 overflow-y-auto">
                        <div className="relative -mt-14 mb-4 flex justify-between items-end">
                            <div className="p-1.5 bg-white rounded-full shadow-sm"><SmartAvatar friend={friend} size="xl" /></div>
                            <button onClick={onEdit} className="mb-2 flex items-center gap-1 px-4 py-2 bg-slate-900 text-white rounded-full text-sm font-bold shadow-md active:scale-95 transition-transform"><Icons.Edit2 size={14} /> 編集</button>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 leading-tight flex items-center gap-2">{friend.name}</h2>
                        {friend.twitterId ? (
                            <a href={`https://x.com/${friend.twitterId}`} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-slate-500 hover:text-blue-500 text-sm font-medium mt-1 mb-6 transition-colors"><Icons.Twitter size={14} /> @{friend.twitterId} <Icons.ExternalLink size={12} /></a>
                        ) : <div className="mb-4"/>}
                        
                        <div className="space-y-6">
                            {/* Birthday Card */}
                            <div className={`flex items-start gap-4 p-4 rounded-2xl border ${friend.isTentative ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'}`}>
                                <div className={`mt-1 ${friend.isTentative ? 'text-amber-500' : 'text-slate-400'}`}>{friend.isTentative ? <Icons.HelpCircle size={20} /> : <Icons.Calendar size={20} />}</div>
                                <div>
                                    <p className={`text-xs font-bold uppercase tracking-wider mb-1 ${friend.isTentative ? 'text-amber-600' : 'text-slate-400'}`}>{friend.isTentative ? 'Birthday (推定)' : 'Birthday'}</p>
                                    <p className="text-lg font-medium text-slate-700">{friend.birthday ? <>{friend.birthday} <span className="ml-1 text-slate-400 text-base">({age}歳)</span></> : '未設定'}</p>
                                    {friend.isTentative && <p className="text-xs text-amber-600 mt-1">※この日付は不確定です</p>}
                                </div>
                            </div>

                            {/* Family List */}
                            {friend.family && friend.family.length > 0 && (
                                <div className="bg-blue-50 rounded-2xl border border-blue-100 p-4">
                                    <div className="flex items-center gap-2 text-blue-800 font-bold mb-3 text-sm">
                                        <Icons.Baby size={18} /> 家族情報
                                    </div>
                                    <div className="space-y-2">
                                        {friend.family.map(member => {
                                            const fAge = calculateAge(member.birthday);
                                            return (
                                                <div key={member.id} className="bg-white p-3 rounded-xl flex items-center justify-between shadow-sm">
                                                    <div className="flex items-baseline gap-2">
                                                        <span className="font-bold text-slate-700">{member.name}</span>
                                                        {fAge !== null && <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">{fAge}歳</span>}
                                                    </div>
                                                    <span className="text-xs text-slate-400">{member.relation}</span>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Memo */}
                            <div className="flex items-start gap-4 px-2">
                                <div className="mt-1 text-slate-400"><Icons.Hash size={20} /></div>
                                <div><p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Memo</p><p className="text-slate-700 whitespace-pre-wrap leading-relaxed text-sm">{friend.memo || 'メモはありません'}</p></div>
                            </div>
                        </div>
                    </div>
                    <div className="p-4 border-t border-slate-100 pb-8">
                        {!deleteConfirm ? (
                            <button onClick={() => setDeleteConfirm(true)} className="w-full py-3 text-red-500 text-sm font-medium hover:bg-red-50 rounded-xl transition-colors flex items-center justify-center gap-2"><Icons.Trash2 size={16} /> 削除する</button>
                        ) : (
                            <div className="bg-red-50 p-4 rounded-xl animate-in slide-in-from-bottom-2 fade-in">
                                <div className="flex items-center gap-2 text-red-600 font-bold mb-3 justify-center"><Icons.AlertTriangle size={18} /> 本当に削除しますか？</div>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(false)} className="flex-1 py-2 bg-white border border-red-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">キャンセル</button>
                                    <button onClick={onDelete} className="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 shadow-sm">削除実行</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [friends, setFriends] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            useEffect(() => localStorage.setItem(STORAGE_KEY, JSON.stringify(friends)), [friends]);
            
            const [selectedFriend, setSelectedFriend] = useState(null);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);

            const friendsByAge = useMemo(() => {
                const grouped = {};
                friends.forEach(friend => {
                    const age = calculateAge(friend.birthday);
                    const key = age !== null ? age : '不明';
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(friend);
                });
                return Object.keys(grouped).sort((a, b) => (a === '不明' ? 1 : b === '不明' ? -1 : b - a)).map(age => ({ age, list: grouped[age] }));
            }, [friends]);

            const handleSave = (data) => {
                if (selectedFriend && isEditing) {
                    setFriends(friends.map(f => f.id === data.id ? data : f));
                    setSelectedFriend(data); setIsEditing(false);
                } else {
                    setFriends([...friends, { ...data, id: Date.now().toString() }]);
                    setIsAddModalOpen(false);
                }
            };

            const handleDelete = (id) => {
                setFriends(friends.filter(f => f.id !== id));
                setSelectedFriend(null); setIsEditing(false);
            };

            const handleRestore = (data) => {
                setFriends(data);
            };

            return (
                <div className="h-full flex flex-col">
                     {/* Header: Stickyにすることで画面上部に固定されつつスクロールに追従しない */}
                    <header className="sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm z-30">
                        <button onClick={() => setIsBackupModalOpen(true)} className="text-slate-400 hover:text-slate-600 transition-colors p-1"><Icons.Settings size={24} /></button>
                        <h1 className="text-lg font-bold text-slate-800">Friends Age</h1>
                        <button onClick={() => setIsAddModalOpen(true)} className="bg-slate-900 text-white w-9 h-9 rounded-full flex items-center justify-center shadow-lg hover:bg-slate-700 active:scale-95 transition-all"><Icons.Plus size={20} /></button>
                    </header>

                    {/* Main Content: 普通のdivとして配置 */}
                    <main className="flex-1 p-4 space-y-8 pb-24">
                        {friendsByAge.map((group) => (
                            <div key={group.age} className="relative flex gap-4">
                                <div className="flex flex-col items-center pt-2 w-14 flex-shrink-0">
                                    <span className="text-2xl font-bold text-slate-700 leading-none">{group.age}</span>
                                    <span className="text-[10px] text-slate-400">歳</span>
                                    <div className="w-0.5 h-full bg-slate-200 mt-2 min-h-[1rem]"></div>
                                </div>
                                <div className="flex-1 space-y-3 pb-2">
                                    {group.list.map(friend => {
                                        const days = getNextBirthday(friend.birthday);
                                        const isSoon = days !== null && days <= 30;
                                        return (
                                            <button key={friend.id} onClick={() => setSelectedFriend(friend)} className="w-full bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:shadow-md active:scale-[0.99] transition-all flex items-center gap-4 text-left relative overflow-hidden group">
                                                {isSoon && <div className="absolute right-0 top-0 bg-amber-100 text-amber-700 text-[9px] px-2 py-0.5 rounded-bl-lg font-bold">もうすぐ</div>}
                                                <SmartAvatar friend={friend} size="md" />
                                                <div className="flex-1 min-w-0 py-1">
                                                    <h3 className="font-bold text-slate-800 truncate leading-tight mb-1 flex items-center gap-1">{friend.name}</h3>
                                                    <div className="flex items-center gap-2 text-xs text-slate-500 mb-1">
                                                        {friend.twitterId && <span className="flex items-center gap-0.5 text-blue-400 bg-blue-50 px-1.5 rounded-md"><Icons.Twitter size={10} /> IDあり</span>}
                                                        {friend.isTentative && <span className="flex items-center gap-0.5 text-amber-600 bg-amber-50 px-1.5 rounded-md font-medium"><Icons.HelpCircle size={10} /> 推定</span>}
                                                    </div>
                                                    {/* Family Mini List */}
                                                    {friend.family && friend.family.length > 0 && (
                                                        <div className="flex flex-wrap gap-1 mt-1">
                                                            {friend.family.map(m => {
                                                                const age = calculateAge(m.birthday);
                                                                return (
                                                                    <span key={m.id} className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200 flex items-center gap-0.5">
                                                                        <span className="opacity-70">👶</span> {m.name}{age !== null && `(${age})`}
                                                                    </span>
                                                                )
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                        {friends.length === 0 && (
                            <div className="text-center py-20 text-slate-400">
                                <p className="mb-4 text-6xl">📭</p>
                                <p className="font-bold text-slate-600 mb-2">まだ誰も登録されていません</p>
                                <p className="text-xs text-slate-400">右上の ＋ ボタンから追加してください。<br/>データはあなたのスマホ内だけに保存されます。</p>
                            </div>
                        )}
                    </main>
                    {(isAddModalOpen || (selectedFriend && isEditing)) && <Modal onClose={() => { setIsAddModalOpen(false); setIsEditing(false); }}><FriendForm initialData={isEditing ? selectedFriend : {}} onSave={handleSave} onCancel={() => { setIsAddModalOpen(false); setIsEditing(false); }} isNew={!isEditing} /></Modal>}
                    {selectedFriend && !isEditing && <Modal onClose={() => setSelectedFriend(null)}><FriendDetail friend={selectedFriend} onClose={() => setSelectedFriend(null)} onEdit={() => setIsEditing(true)} onDelete={() => handleDelete(selectedFriend.id)} /></Modal>}
                    {isBackupModalOpen && <Modal onClose={() => setIsBackupModalOpen(false)}><BackupModal friends={friends} onRestore={handleRestore} onClose={() => setIsBackupModalOpen(false)} /></Modal>}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
