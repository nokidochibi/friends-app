        };

        const STORAGE_KEY = 'friends_tracker_secure_v22_final';

        // --- Constants & Utils ---
        const THEME_COLORS = [
            { name: 'Slate', bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-200' } // Default
        ];

        const calculateAge = (birthday) => {
            if (!birthday) return null;
            const birthDate = new Date(birthday);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        };

        const getNextBirthday = (birthday) => {
            if (!birthday) return null;
            const today = new Date();
            const birthDate = new Date(birthday);
            const next = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (next < today) next.setFullYear(today.getFullYear() + 1);
            const diffTime = Math.abs(next - today);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        };

        const getMonth = (birthday) => {
            if (!birthday) return -1;
            return new Date(birthday).getMonth() + 1;
        };

        const extractTwitterId = (input) => {
            if (!input) return '';
            try {
                if (input.includes('twitter.com') || input.includes('x.com')) {
                    const url = new URL(input);
                    const pathSegments = url.pathname.split('/').filter(Boolean);
                    return pathSegments[0] || '';
                }
            } catch (e) {}
            return input.replace('@', '').split('?')[0].split('/')[0].trim();
        };

        const sortFamily = (family) => {
            if (!family) return [];
            return [...family].sort((a, b) => {
                const ageA = calculateAge(a.birthday);
                const ageB = calculateAge(b.birthday);
                if (ageA !== null && ageB !== null) return ageB - ageA;
                if (ageA !== null) return -1;
                if (ageB !== null) return 1;
                return 0;
            });
        };

        const resizeImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxSize = 150;
                        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const extractTags = (memo) => {
            if (!memo) return [];
            const matches = memo.match(/#[\w\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\uff00-\uff9f\u4e00-\u9faf\u3400-\u4dbf]+/g);
            return matches ? matches.map(tag => tag.substring(1)) : [];
        };

        // --- Components ---
        const Modal = ({ children, onClose }) => {
            useEffect(() => {
                document.body.classList.add('modal-open');
                return () => document.body.classList.remove('modal-open');

                        {children}
                    </div>
                </div>
            );
        };

        const SmartAvatar = ({ friend, size = "md", className = "" }) => {
            const [imgError, setImgError] = useState(false);
            useEffect(() => setImgError(false), [friend.twitterId, friend.customImage]);
            const sizeClasses = { xs: "w-6 h-6 text-xs", sm: "w-10 h-10 text-lg", md: "w-12 h-12 text-xl", lg: "w-24 h-24 text-4xl", xl: "w-28 h-28 text-5xl" };
            
            if (friend.customImage) {
                return (
                    <div className={`${sizeClasses[size]} rounded-full overflow-hidden border border-slate-200 bg-slate-100 shadow-sm flex-shrink-0 relative ${className}`}>
                        <img src={friend.customImage} alt={friend.name} className="w-full h-full object-cover" />
                    </div>
                );
            }
            if (friend.twitterId && friend.twitterId.trim() !== ''
